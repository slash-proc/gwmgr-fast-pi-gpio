# Explicit Raspberry Pi SWD interface for the rpi-fast-gpio hardware test.
#
# Raspberry Pi 4/400 header wiring:
#   GPIO11 (physical pin 23) -> target SWCLK
#   GPIO10 (physical pin 19) -> target SWDIO
#   GND                     -> target GND
#
# The target must be powered separately with 3.3 V-compatible I/O.

adapter driver bcm2835gpio

# BCM2711 peripheral base used by the Pi 4/400.
bcm2835gpio peripheral_base 0xFE000000

# Calibration values used by the bcm2835gpio backend.
bcm2835gpio speed_coeffs 113714 28

# SWD-only GPIO mapping. Do not use the native config's GPIO25 default.
adapter gpio swclk -chip 0 11
adapter gpio swdio -chip 0 10

transport select swd
adapter speed 1000

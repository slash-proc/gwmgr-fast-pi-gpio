# OpenOCD configuration for the local rpi-fast-gpio CMSIS-DAP TCP server.
#
# Note: the OpenOCD 0.12.0+dev-snapshot installed on the test Pi rejects
# "cmsis-dap backend tcp" before connecting. This file is for builds that
# provide that backend; use gdb-swd for the supported GnWManager path there.
#
# Start the probe server on the Pi first:
#   sudo ./build/cmsis-dap-tcp
#
# This is a loopback TCP connection on the Pi; no USB gadget mode is used.

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 127.0.0.1
cmsis-dap tcp port 4441
transport select swd
adapter speed 128000

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnwmanager-fastpi"
version = "0.1.0"
description = "Raspberry Pi native SWD probe launcher for GnWManager"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cython = ["Cython>=3"]

[project.scripts]
gnwmanager-fastpi = "gnwmanager_fastpi.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
